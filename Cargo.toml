[package]
name = "remix"
version = "0.2.0"
edition = "2021"
authors = ["Trenton Sousa tdsousa1993@gmail.com"]
description = "A Rust implementation of repomix - pack repositories for AI tools"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CodingInCarhartts/remix"
keywords = ["ai", "repository", "packing", "llm"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
walkdir = "2.5"
ignore = "0.4"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"
console = "0.16"
tempfile = "3.14"
git2 = "0.20"

rayon = "1.11"
tree_magic_mini = "3.2"
glob-match = "0.2"
rtoon = "0.2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.14"
test-case = "3.3"
mockall = "0.14"
assert_fs = "1.1"
predicates = "3.1"
